[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lab"
version = "0.2.0"
description = "麻雀虽小、五脏俱全的迷你大模型全栈实验仓：mHC + Engram + 3:1 GQA + MoE + 稳定交叉熵 + Muon + WSD + MOPD + Dr.GRPO + OpenAI 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.package-data]
src = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
