[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lab"
version = "0.1.0"
description = "Minimal, readable LLM from scratch (BPE, RoPE, GQA, KV Cache, Muon, WSD, SFT, Dr.GRPO) for learning and interview prep."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
